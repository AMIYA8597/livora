# Production / Staging Docker Compose Configuration
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: flatmate_api_prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SYNC_URL=${DATABASE_SYNC_URL}
      # The bundled Redis requires REDIS_PASSWORD, so the defaults carry it.
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/2}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Background jobs: outbox retries (every 15s), hourly maintenance including account erasure,
  # and the weekly ranker retrain. Same code and settings as the API; scale `worker` freely, but
  # run exactly one `beat`, or every scheduled job runs once per beat.
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: flatmate_worker_prod
    restart: unless-stopped
    environment: &worker_env
      - ENVIRONMENT=staging
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:-changeme_redis_prod}@redis:6379/2}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --without-gossip --without-mingle

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: flatmate_beat_prod
    restart: unless-stopped
    environment: *worker_env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: flatmate_web_prod
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.flatmate.internal/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://api.flatmate.internal/api/v1/messaging/ws}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://flatmate.internal}
    expose:
      - "3000"
    depends_on:
      - api

  redis:
    image: redis:7.2-alpine
    container_name: flatmate_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis_prod}
    volumes:
      - redis_prod_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_prod}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: flatmate_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  redis_prod_data:
