name: Back up the database (verified)
description: >-
  Dumps the database with scripts/db_backup.py, restores the dump into a throwaway PostGIS +
  pgvector container and checks it against its manifest (Alembic revision, every table's row
  count, RLS), then uploads the dump and manifest to Cloud Storage or to a private Azure Blob
  container. A backup that doesn't restore fails the job and is never uploaded. Needs Docker,
  Python (actions/setup-python), and for Cloud Storage gcloud already authenticated.
inputs:
  database-url:
    description: Owner connection URL of the database to back up
    required: true
  bucket:
    description: Cloud Storage bucket for backups (name only). Give this or azure-sas-url.
    required: false
    default: ""
  azure-sas-url:
    description: >-
      Azure Blob container URL with a write-only SAS token
      (https://<account>.blob.core.windows.net/<container>?<sas>), for the free-tier setup.
    required: false
    default: ""
  label:
    description: Folder and file label, e.g. production or pre-deploy-<sha>
    required: true
  folder:
    description: Folder inside the bucket
    required: true
  pg-version:
    description: PostgreSQL major version of the server (client and restore target use it)
    required: false
    default: "17"
outputs:
  object:
    description: Where the dump was uploaded (gs:// path or Azure blob path without the token)
    value: ${{ steps.upload.outputs.object }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-postgres-client
      with:
        version: ${{ inputs.pg-version }}

    - name: Install the backup tool's dependency
      shell: bash
      run: python -m pip install --quiet "asyncpg>=0.29"

    - name: Dump
      id: dump
      shell: bash
      env:
        BACKUP_DATABASE_URL: ${{ inputs.database-url }}
        LABEL: ${{ inputs.label }}
      run: |
        echo "::add-mask::$BACKUP_DATABASE_URL"
        out="$RUNNER_TEMP/backup"
        python scripts/db_backup.py backup --out "$out" --label "$LABEL"
        dump=$(ls "$out"/*.dump | head -1)
        echo "dump=$dump" >> "$GITHUB_OUTPUT"

    - name: Restore into a throwaway database and check it
      shell: bash
      env:
        PG_VERSION: ${{ inputs.pg-version }}
        DUMP: ${{ steps.dump.outputs.dump }}
      run: |
        password=$(openssl rand -hex 16)
        echo "::add-mask::$password"
        docker run -d --name restore-check -e POSTGRES_PASSWORD="$password" -p 127.0.0.1:55432:5432 \
          "postgis/postgis:${PG_VERSION}-3.5" >/dev/null
        trap 'docker rm -f restore-check >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 60); do
          docker exec restore-check pg_isready -U postgres >/dev/null 2>&1 && break
          sleep 2
        done
        # pgvector, as on Supabase (same steps as the CI test database). PGDG moved bullseye, the
        # postgis image's base, to its archive host.
        docker exec restore-check bash -c "sed -i 's#apt.postgresql.org/pub/repos/apt#apt-archive.postgresql.org/pub/repos/apt#g' /etc/apt/sources.list.d/*.list && apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends postgresql-${PG_VERSION}-pgvector >/dev/null"
        docker exec restore-check psql -U postgres -qc "CREATE DATABASE restore_check"
        python scripts/db_backup.py restore --dump "$DUMP" --confirm-database restore_check \
          --target-url "postgresql://postgres:${password}@127.0.0.1:55432/restore_check"

    - name: Upload
      id: upload
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        AZURE_SAS_URL: ${{ inputs.azure-sas-url }}
        FOLDER: ${{ inputs.folder }}
        DUMP: ${{ steps.dump.outputs.dump }}
      run: |
        # The manifest goes last: a manifest in storage means its dump is complete.
        if [ -n "$AZURE_SAS_URL" ]; then
          echo "::add-mask::${AZURE_SAS_URL#*\?}"
          container="${AZURE_SAS_URL%%\?*}"
          sas="${AZURE_SAS_URL#*\?}"
          for file in "$DUMP" "$DUMP.manifest.json"; do
            # The link allows creating blobs only: it can never overwrite, read or delete a backup.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT --max-time 600 \
              -H "x-ms-blob-type: BlockBlob" -H "x-ms-version: 2021-08-06" \
              --data-binary "@$file" "$container/$FOLDER/$(basename "$file")?$sas")
            [ "$code" = 201 ] || { echo "::error::Upload of $(basename "$file") failed (HTTP $code)"; exit 1; }
          done
          object="$container/$FOLDER/$(basename "$DUMP")"
        elif [ -n "$BUCKET" ]; then
          dest="gs://$BUCKET/$FOLDER/"
          gcloud storage cp --no-clobber "$DUMP" "$dest"
          gcloud storage cp --no-clobber "$DUMP.manifest.json" "$dest"
          object="$dest$(basename "$DUMP")"
        else
          echo "::error::Give the bucket or azure-sas-url input"
          exit 1
        fi
        echo "object=$object" >> "$GITHUB_OUTPUT"
        python3 - "$DUMP.manifest.json" "$object" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, sys
        m = json.load(open(sys.argv[1]))
        print("### Database backup")
        print(f"- `{sys.argv[2]}` ({m['size_bytes'] / 1e6:.1f} MB)")
        print(f"- revision `{m['alembic_revision']}`, {len(m['tables'])} tables, {sum(m['tables'].values())} rows")
        print("- restored into a throwaway database and matched its manifest")
        PY
