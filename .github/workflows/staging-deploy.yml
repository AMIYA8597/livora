name: Staging Deployment Pipeline

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: "false"

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  # Decide what can actually be deployed. Jobs whose secrets are missing show as SKIPPED
  # (never as a fake green success) and a warning names exactly what is missing.
  preflight:
    name: Check Staging Deployment Configuration
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      database: ${{ steps.check.outputs.database }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ready() {
            local target="$1"; shift
            local missing=()
            for name in "$@"; do [ -z "${!name}" ] && missing+=("$name"); done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "$target=true" >> "$GITHUB_OUTPUT"
            else
              echo "$target=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Staging $target not deployed::Missing secrets in the 'staging' environment: ${missing[*]}"
            fi
          }
          ready backend GCP_SA_KEY GCP_PROJECT_ID
          ready database STAGING_DATABASE_URL
          ready frontend VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID

  # Schema first, so newly deployed code never runs against an older schema.
  database-migration:
    name: Apply Database Migrations (Staging)
    needs: [preflight]
    if: needs.preflight.outputs.database == 'true' && github.event.inputs.skip_migrations != 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API package (Alembic env imports the app models)
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api

      - name: Execute Alembic Migration Forward
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ENVIRONMENT: staging
        run: |
          echo "::add-mask::$DATABASE_URL"
          cd apps/api
          python -m alembic upgrade head
          python -m alembic current

  build-and-deploy-backend:
    name: Build & Deploy Backend Container to Cloud Run (Staging)
    needs: [preflight, database-migration]
    # Run when the backend is configured and migrations either succeeded or were legitimately skipped.
    if: >-
      always() && needs.preflight.outputs.backend == 'true' &&
      (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Backend Container
        run: |
          IMAGE_TAG="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/flatmate-api:${{ github.sha }}"
          LATEST_TAG="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/flatmate-api:staging-latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" -f apps/api/Dockerfile apps/api
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      # The API and the worker run the same image with the same configuration, so they can't drift.
      # Runtime uses the least-privilege login (scripts/create_app_db_user.sql); the owner URL in the
      # GitHub secret STAGING_DATABASE_URL is used only by the migration job above.
      #
      # Redis is one Secret Manager secret, STAGING_REDIS_URL (rediss:// for a managed Redis over
      # TLS). The API uses it for shared rate limits, its cache and chat across instances; the
      # worker uses it as its queue. Until the secret exists, the API runs without Redis and the
      # worker isn't deployed. A Redis on a private network (Memorystore) also needs the
      # environment variables STAGING_VPC_NETWORK and STAGING_VPC_SUBNET (Direct VPC egress).
      - name: Resolve runtime configuration
        id: runtime
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          VPC_NETWORK: ${{ vars.STAGING_VPC_NETWORK }}
          VPC_SUBNET: ${{ vars.STAGING_VPC_SUBNET }}
        run: |
          ENV_VARS="ENVIRONMENT=staging,DEBUG=False,PROJECT_NAME=Flatmate Platform Staging,APP_RELEASE=${{ github.sha }},GOOGLE_CLOUD_PROJECT=$PROJECT,TRUSTED_PROXY_HOPS=1"
          SECRETS="DATABASE_URL=STAGING_APP_DATABASE_URL:latest,SECRET_KEY=STAGING_SECRET_KEY:latest,SUPABASE_JWT_SECRET=STAGING_SUPABASE_JWT_SECRET:latest"
          if gcloud secrets describe STAGING_REDIS_URL --project "$PROJECT" >/dev/null 2>&1; then
            SECRETS="$SECRETS,REDIS_URL=STAGING_REDIS_URL:latest,CELERY_BROKER_URL=STAGING_REDIS_URL:latest,CELERY_RESULT_BACKEND=STAGING_REDIS_URL:latest"
            echo "redis=true" >> "$GITHUB_OUTPUT"
          else
            echo "redis=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging worker not deployed::Create the Secret Manager secret STAGING_REDIS_URL (a managed Redis URL) to deploy the worker and beat. Until then failed emails are retried only when a later request dispatches, rate limits are per instance, and maintenance (including account erasure) doesn't run."
          fi
          NETWORK_FLAGS=""
          if [ -n "$VPC_NETWORK" ] && [ -n "$VPC_SUBNET" ]; then
            NETWORK_FLAGS="--network=$VPC_NETWORK --subnet=$VPC_SUBNET --vpc-egress=private-ranges-only"
          fi
          {
            echo "image=asia-south1-docker.pkg.dev/$PROJECT/cloud-run-source-deploy/flatmate-api:${{ github.sha }}"
            echo "env_vars=$ENV_VARS"
            echo "secrets=$SECRETS"
            echo "network_flags=$NETWORK_FLAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run Staging
        id: deploy
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
          ENV_VARS: ${{ steps.runtime.outputs.env_vars }}
          SECRETS: ${{ steps.runtime.outputs.secrets }}
          NETWORK_FLAGS: ${{ steps.runtime.outputs.network_flags }}
        run: |
          # shellcheck disable=SC2086 # NETWORK_FLAGS holds several flags
          gcloud run deploy flatmate-api-staging \
            --image "$IMAGE" \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRETS" \
            $NETWORK_FLAGS
          URL=$(gcloud run services describe flatmate-api-staging --region asia-south1 --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # One instance running the Celery worker with the beat scheduler inside it
      # (python -m app.workers.run): outbox retries every 15 seconds, hourly maintenance including
      # account erasure, and the weekly ranker retrain. CPU stays allocated with no requests
      # coming in, and exactly one instance means exactly one beat. The deploy succeeds only once
      # the worker has reached Redis and is taking tasks (the startup probe on /health).
      - name: Deploy worker and beat to Cloud Run Staging
        if: steps.runtime.outputs.redis == 'true'
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
          ENV_VARS: ${{ steps.runtime.outputs.env_vars }}
          SECRETS: ${{ steps.runtime.outputs.secrets }}
          NETWORK_FLAGS: ${{ steps.runtime.outputs.network_flags }}
        run: |
          # shellcheck disable=SC2086 # NETWORK_FLAGS holds several flags
          gcloud run deploy flatmate-worker-staging \
            --image "$IMAGE" \
            --region asia-south1 \
            --platform managed \
            --command python \
            --args=-m,app.workers.run \
            --no-allow-unauthenticated \
            --ingress internal \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --cpu 1 \
            --memory 1Gi \
            --startup-probe "httpGet.path=/health,periodSeconds=5,timeoutSeconds=3,failureThreshold=24" \
            --liveness-probe "httpGet.path=/health,periodSeconds=30,timeoutSeconds=5,failureThreshold=3" \
            --set-env-vars "$ENV_VARS,WORKER_CONCURRENCY=2" \
            --set-secrets "$SECRETS" \
            $NETWORK_FLAGS

  build-and-deploy-frontend:
    name: Build & Deploy Frontend to Vercel (Staging)
    needs: [preflight]
    if: needs.preflight.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Staging Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  verify-staging:
    name: Staging Smoke Test (backend readiness)
    needs: [build-and-deploy-backend]
    if: needs.build-and-deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check /health/ready on the deployed backend
        env:
          API_URL: ${{ needs.build-and-deploy-backend.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$API_URL/health/ready" || true)
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            echo "Attempt $attempt: HTTP $code"; sleep 10
          done
          echo "::error::Staging backend is not ready at $API_URL/health/ready"
          exit 1
