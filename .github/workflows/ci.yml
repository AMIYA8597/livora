name: Flatmate Platform CI Pipeline

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Lint, Typecheck & Pytest Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatmate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for Geo & PG
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc libgeos-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "apps/api[dev]"

      - name: Python Linter (Ruff)
        run: |
          python -m ruff check apps/api

      - name: Python Static Type Check (Mypy)
        run: |
          python -m mypy apps/api/app

      - name: API Contract Is Backward Compatible (packages/contracts/openapi/v1.json)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Installed apps are built against the previous contract. (The pytest suite checks the
          # snapshot matches the code.) Intended breaks are listed in accepted-breaking-changes.txt.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare with."; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA:packages/contracts/openapi/v1.json" 2>/dev/null; then
            echo "The previous commit has no API contract snapshot yet."; exit 0
          fi
          git show "$BASE_SHA:packages/contracts/openapi/v1.json" > "$RUNNER_TEMP/openapi-base.json"
          cd apps/api && python -m app.core.api_contract compat "$RUNNER_TEMP/openapi-base.json"

      - name: Install pgvector into PostGIS service (matches Supabase extensions)
        run: |
          PG_CONTAINER=$(docker ps --filter "ancestor=postgis/postgis:17-3.5" --format "{{.ID}}")
          # PGDG moved bullseye (the postgis image base) to its archive host.
          docker exec "$PG_CONTAINER" bash -c "sed -i 's#apt.postgresql.org/pub/repos/apt#apt-archive.postgresql.org/pub/repos/apt#g' /etc/apt/sources.list.d/*.list && apt-get update && apt-get install -y --no-install-recommends postgresql-17-pgvector"
          PGPASSWORD=postgres psql -h localhost -U postgres -d flatmate_db -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Database Schema & Migration Verification
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flatmate_db
          DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/flatmate_db
        run: |
          cd apps/api
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          PGPASSWORD=postgres psql -h localhost -U postgres -d flatmate_db -tAc             "SELECT 1 FROM pg_indexes WHERE indexname = 'ix_profiles_lifestyle_embedding_hnsw'" | grep -q 1

      - name: Verify Least-Privilege API Login (scripts/create_app_db_user.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d flatmate_db             -v app_user=flatmate_api_ci -v app_password=ci_only_password -f scripts/create_app_db_user.sql
          export PGPASSWORD=ci_only_password
          # DML works (RLS policy admits the app role)...
          psql -h localhost -U flatmate_api_ci -d flatmate_db -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM users"
          # ...but schema changes and privilege escalation are refused.
          for stmt in "CREATE TABLE public.ci_probe (id int)" "DROP TABLE public.users"                       "ALTER TABLE public.users DISABLE ROW LEVEL SECURITY" "TRUNCATE public.messages"                       "UPDATE public.alembic_version SET version_num = 'x'" "SET ROLE postgres"; do
            if psql -h localhost -U flatmate_api_ci -d flatmate_db -v ON_ERROR_STOP=1 -tAc "$stmt" 2>/dev/null; then
              echo "::error::API login was allowed to run: $stmt"; exit 1
            fi
          done
          psql -h localhost -U flatmate_api_ci -d flatmate_db -tAc "SHOW statement_timeout" | grep -q 15s

      # pg_dump/pg_restore matching the PostGIS 17 service, for the backup-and-restore test.
      - name: Set up PostgreSQL 17 client
        uses: ./.github/actions/setup-postgres-client
        with:
          version: "17"

      - name: Execute Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flatmate_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_characters_1234567890
        run: |
          python -m pytest apps/api/tests -v --durations=10

  frontend-quality-gate:
    name: Frontend Monorepo Quality Gate & Next.js Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Contracts & UI Packages
        run: |
          pnpm --filter @flatmate/contracts test
          pnpm --filter @flatmate/ui test

      - name: Lint Web Application (errors fail the build)
        run: pnpm --filter @flatmate/web lint

      - name: Audit Production Dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run Web Application Tests
        run: |
          pnpm --filter @flatmate/web test

      - name: Build Next.js Production Bundle
        run: |
          pnpm --filter @flatmate/web build
        env:
          NEXT_PUBLIC_APP_URL: https://staging.flatmate.platform
          NEXT_PUBLIC_API_URL: https://api-staging.flatmate.platform/api/v1
          NEXT_PUBLIC_WS_URL: wss://api-staging.flatmate.platform/api/v1/messaging/ws
          NEXT_PUBLIC_SUPABASE_URL: https://staging-project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key_for_build

  e2e:
    name: Browser Journeys (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate]
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatmate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The API, run the way a developer runs it locally: in-memory email and SMS, no outside calls.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flatmate_db
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flatmate_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e_only_secret_key_minimum_32_characters_123456
      EMAIL_PROVIDER: memory
      SMS_PROVIDER: memory
      CORS_ORIGINS: '["http://localhost:3000"]'
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for Geo & PG
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc libgeos-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "apps/api[dev]"

      - name: Install pgvector into PostGIS service
        run: |
          PG_CONTAINER=$(docker ps --filter "ancestor=postgis/postgis:17-3.5" --format "{{.ID}}")
          docker exec "$PG_CONTAINER" bash -c "sed -i 's#apt.postgresql.org/pub/repos/apt#apt-archive.postgresql.org/pub/repos/apt#g' /etc/apt/sources.list.d/*.list && apt-get update && apt-get install -y --no-install-recommends postgresql-17-pgvector"
          PGPASSWORD=postgres psql -h localhost -U postgres -d flatmate_db -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Migrate and Seed
        run: |
          cd apps/api
          python -m alembic upgrade head
          python ../../database/seeds/seed.py

      - name: Start API
        run: |
          cd apps/api
          nohup python -m uvicorn app.main:app --port 8000 > ../../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health > /dev/null && exit 0; sleep 1; done
          cat ../../api.log; exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Start Web
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/messaging/ws
          NEXT_PUBLIC_SUPABASE_URL: https://e2e-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
        run: |
          pnpm --filter @flatmate/web build
          cd apps/web
          nohup pnpm exec next start -p 3000 > ../../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 1; done
          cat ../../web.log; exit 1

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Browser Journeys
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright Report and Server Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
          retention-days: 7
