name: Security & Vulnerability Scan

on:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability & Secret Leakage Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit -e "apps/api[dev]"

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r apps/api/app -ll -ii

      - name: Python Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc || true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Dependency Security Audit (pnpm audit)
        run: |
          pnpm audit --audit-level=high || true

      - name: Secret Scan for Accidental Credentials
        run: |
          # Ensure no private keys, passwords, or service-role keys committed
          ! git grep -i "SUPABASE_SERVICE_ROLE_KEY=ey" -- ':!.env*.example'
          ! git grep -i "BEGIN RSA PRIVATE KEY" -- ':!*.pem'
          ! git grep -i "postgres:[^@]*@" -- ':!.env*.example' ':!docker-compose*.yml' ':!apps/api/tests/*' ':!database/seeds/*'

      - name: Execute Security Regression Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: security_audit_test_key_minimum_32_characters_123
        run: |
          python -m pytest apps/api/tests/test_security_hardening.py apps/api/tests/test_auth_rbac.py apps/api/tests/test_infrastructure_resilience.py -v
