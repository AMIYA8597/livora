name: Security & Vulnerability Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability & Secret Leakage Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit -e "apps/api[dev]" -c apps/api/constraints.txt

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r apps/api/app -ll -ii

      - name: Python Dependency Vulnerability Audit (pip-audit)
        run: |
          # Fails on any known vulnerability in the installed (pinned) set.
          pip-audit --desc --skip-editable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Dependency Security Audit (pnpm audit)
        run: |
          pnpm audit --audit-level=high

      - name: Secret Scan (committed files)
        run: python scripts/secret_scan.py

      - name: Secret Scan (whole git history)
        # Weekly and on demand: a secret that was ever pushed stays readable in history, so the
        # only fix is rotating it. See scripts/secret_scan.py.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/secret_scan.py --history
