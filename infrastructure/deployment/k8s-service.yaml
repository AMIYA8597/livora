apiVersion: v1
kind: Service
metadata:
  name: flatmate-api-svc
spec:
  selector:
    app: flatmate-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: flatmate-web-svc
spec:
  selector:
    app: flatmate-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
