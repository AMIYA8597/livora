apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatmate-api
  labels:
    app: flatmate-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flatmate-api
  template:
    metadata:
      labels:
        app: flatmate-api
    spec:
      containers:
        - name: api
          image: ghcr.io/flatmate/flatmate-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flatmate-config
            - secretRef:
                name: flatmate-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatmate-web
  labels:
    app: flatmate-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flatmate-web
  template:
    metadata:
      labels:
        app: flatmate-web
    spec:
      containers:
        - name: web
          image: ghcr.io/flatmate/flatmate-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.flatmate.platform/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.flatmate.platform/api/v1/messaging/ws"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Background jobs: the Celery worker with the beat scheduler inside it (app.workers.run).
# Exactly one replica, replaced with Recreate, so there is never more than one beat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatmate-worker
  labels:
    app: flatmate-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flatmate-worker
  template:
    metadata:
      labels:
        app: flatmate-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/flatmate/flatmate-api:latest
          command: ["python", "-m", "app.workers.run"]
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: flatmate-config
            - secretRef:
                name: flatmate-secrets
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
