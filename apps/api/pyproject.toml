[project]
name = "flatmate-api"
version = "1.0.0"
description = "FastAPI Backend for Flatmate Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy[asyncio]>=2.1,<2.2",  # 2.1: postgresql.distinct_on
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.3.1",
    "geoalchemy2>=0.15.1",
    "shapely>=2.0.4",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "pillow>=11.0.0",
    "PyJWT[crypto]>=2.10,<3",  # JWTs (python-jose dropped: unfixed advisories)
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx[http2]>=0.27.0",  # HTTP/2 for APNs
    "anthropic>=2.13,<3",
    "pywebpush>=2.0,<3",
    "sentry-sdk[fastapi,celery]>=2.20,<3",
    "minio>=7.2.7",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "websockets>=12.0",
    "bcrypt>=4.1.0",  # used directly by app.core.security
    "supabase>=2.31.0",  # production storage backend
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "psutil>=5.9.0",  # performance benchmark tests
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the application package is installable; migrations/ and tests/ are not packages to ship.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results do not change when ruff's default rules change between releases.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]

