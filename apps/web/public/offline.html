<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173D32">
  <title>You're offline | Flatmate</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FAF8F5; color: #1F2A24; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1.25rem; border-radius: 16px; background: #173D32;
            display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 1.375rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; line-height: 1.5; color: #4B5A52; }
    button { font: inherit; font-weight: 600; color: #fff; background: #173D32; border: 0; border-radius: 999px;
             padding: .75rem 1.5rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #E0A458; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="10 11 20 19" fill="none">
        <path d="M12 21L20 13L28 21V27C28 27.55 27.55 28 27 28H13C12.45 28 12 27.55 12 27V21Z" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 28V22H23V28" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Flatmate needs a connection to show rooms, messages and matches. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
